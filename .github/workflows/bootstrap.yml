name: Bootstrap Nuvio Provider Workspace

on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: "Optional first provider ID, e.g. firstprovider"
        required: false
        default: ""
      provider_name:
        description: "Optional first provider name"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Nuvio workspace
        shell: bash
        env:
          PROVIDER_ID: ${{ inputs.provider_id }}
          PROVIDER_NAME: ${{ inputs.provider_name }}
        run: |
          set -e

          mkdir -p src/_template providers scripts tests

          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "test-plugin-nuvio-providers",
            "version": "1.0.0",
            "private": true,
            "description": "Nuvio provider development workspace",
            "scripts": {
              "build": "node build.js",
              "validate": "node scripts/validate-manifest.js",
              "test:provider": "node tests/test-provider.js"
            },
            "devDependencies": {
              "esbuild": "^0.25.0"
            }
          }
          EOF
          fi

          if [ ! -f .gitignore ]; then
            cat > .gitignore <<'EOF'
          node_modules/
          .env
          *.log
          EOF
          fi

          if [ ! -f manifest.json ]; then
            echo '[]' > manifest.json
          fi

          if [ ! -f src/_template/index.js ]; then
            cat > src/_template/index.js <<'EOF'
          async function getStreams(tmdbId, mediaType, season, episode) {
            console.log("[provider]", { tmdbId, mediaType, season, episode });

            // Return:
            // [{
            //   name: "Provider",
            //   title: "1080p",
            //   url: "https://example.com/video.m3u8",
            //   quality: "1080p",
            //   headers: {}
            // }]

            return [];
          }

          module.exports = { getStreams };
          EOF
          fi

          if [ ! -f build.js ]; then
            cat > build.js <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const esbuild = require("esbuild");

          const srcRoot = path.join(__dirname, "src");
          const outRoot = path.join(__dirname, "providers");

          fs.mkdirSync(outRoot, { recursive: true });

          const requested = process.argv[2];

          const names = requested
            ? [requested]
            : fs.readdirSync(srcRoot, { withFileTypes: true })
                .filter(x => x.isDirectory() && !x.name.startsWith("_"))
                .map(x => x.name);

          (async () => {
            for (const name of names) {
              const entry = path.join(srcRoot, name, "index.js");

              if (!fs.existsSync(entry)) {
                throw new Error(`Missing entry: ${entry}`);
              }

              await esbuild.build({
                entryPoints: [entry],
                bundle: true,
                platform: "node",
                format: "cjs",
                target: "es2020",
                outfile: path.join(outRoot, `${name}.js`)
              });

              console.log(`Built providers/${name}.js`);
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF
          fi

          if [ ! -f scripts/validate-manifest.js ]; then
            cat > scripts/validate-manifest.js <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const root = path.join(__dirname, "..");
          const manifest = JSON.parse(
            fs.readFileSync(path.join(root, "manifest.json"), "utf8")
          );

          if (!Array.isArray(manifest)) {
            throw new Error("manifest.json must contain an array");
          }

          const ids = new Set();

          for (const item of manifest) {
            for (const key of ["id", "name", "version", "filename"]) {
              if (!item[key]) {
                throw new Error(`Manifest entry missing ${key}`);
              }
            }

            if (ids.has(item.id)) {
              throw new Error(`Duplicate provider id: ${item.id}`);
            }
            ids.add(item.id);

            const file = path.join(root, item.filename);

            if (!fs.existsSync(file)) {
              throw new Error(`Built provider missing: ${item.filename}`);
            }

            delete require.cache[require.resolve(file)];
            const provider = require(file);

            if (!provider || typeof provider.getStreams !== "function") {
              throw new Error(`${item.filename} must export getStreams()`);
            }
          }

          console.log(`Manifest valid: ${manifest.length} provider(s)`);
          EOF
          fi

          if [ ! -f tests/test-provider.js ]; then
            cat > tests/test-provider.js <<'EOF'
          const path = require("path");

          const [providerId, tmdbId, mediaType = "movie", season, episode] =
            process.argv.slice(2);

          if (!providerId || !tmdbId) {
            console.error(
              "Usage: npm run test:provider -- <providerId> <tmdbId> [movie|tv] [season] [episode]"
            );
            process.exit(1);
          }

          const provider = require(
            path.join(__dirname, "..", "providers", `${providerId}.js`)
          );

          Promise.resolve(
            provider.getStreams(
              tmdbId,
              mediaType,
              season ? Number(season) : undefined,
              episode ? Number(episode) : undefined
            )
          )
            .then(streams => {
              if (!Array.isArray(streams)) {
                throw new Error("getStreams() must return an array");
              }

              console.log(JSON.stringify(streams, null, 2));
            })
            .catch(err => {
              console.error(err);
              process.exit(1);
            });
          EOF
          fi

          touch providers/.gitkeep

          if [ -n "$PROVIDER_ID" ]; then
            if ! echo "$PROVIDER_ID" | grep -Eq '^[a-z0-9_-]+$'; then
              echo "Invalid provider_id. Use only a-z, 0-9, _ and -."
              exit 1
            fi

            mkdir -p "src/$PROVIDER_ID"

            if [ ! -f "src/$PROVIDER_ID/index.js" ]; then
              cp src/_template/index.js "src/$PROVIDER_ID/index.js"
            fi

            node <<'EOF'
          const fs = require("fs");

          const providerId = process.env.PROVIDER_ID;
          const providerName = process.env.PROVIDER_NAME || providerId;

          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));

          if (!manifest.some(x => x.id === providerId)) {
            manifest.push({
              id: providerId,
              name: providerName,
              description: `${providerName} Nuvio provider`,
              version: "1.0.0",
              author: "Luckez12",
              supportedTypes: ["movie", "tv"],
              filename: `providers/${providerId}.js`,
              enabled: true
            });

            fs.writeFileSync(
              "manifest.json",
              JSON.stringify(manifest, null, 2) + "\n"
            );
          }
          EOF
          fi

      - name: Install dependencies
        run: npm install

      - name: Build providers
        run: npm run build

      - name: Validate manifest
        run: npm run validate

      - name: Commit bootstrap
        shell: bash
        run: |
          set -e

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Bootstrap Nuvio provider workspace"
          git push
          
