name: Build Nuvio Providers

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "manifest.json"
      - "build.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvio-provider-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build providers
        run: npm run build

      - name: Validate manifest
        run: npm run validate

      - name: Commit built providers
        shell: bash
        run: |
          if [ -z "$(git status --porcelain providers/ package-lock.json 2>/dev/null)" ]; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add providers/ package-lock.json 2>/dev/null || true
          git commit -m "Build Nuvio providers"
          git push
          
