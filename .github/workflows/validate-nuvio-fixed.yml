name: Validate Provider Repository

on:
  workflow_run:
    workflows:
      - "Apply ZIP Patch"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "manifest.json"
      - "providers/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-nuvio-fixed.yml"
  pull_request:
    branches:
      - main
    paths:
      - "manifest.json"
      - "providers/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-nuvio-fixed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-provider-repository-${{ github.event_name }}-${{ github.ref || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main after ZIP patch
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout current revision
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Check provider syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in providers/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate manifest and provider exports
        run: npm run validate
