name: Validate Nuvio Plugin

on:
  workflow_run:
    workflows:
      - "Apply ZIP Patch"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-nuvio-after-zip-patch
  cancel-in-progress: false

jobs:
  validate:
    # Auto-run only after Apply ZIP Patch has finished successfully.
    # workflow_dispatch still allows manual validation.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build providers
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script. Skipping build."
          fi

      - name: Validate manifest
        run: node scripts/validate-manifest.js
